[project]
name = "shapesdb"
version = "0.1.0"
description = "Python SDK for ShapesDB: version control and collaboration for 3D"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dependencies = ["httpx>=0.27"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics :: 3D Modeling"]

[project.urls]
Homepage = "https://shapesdb.com"
Source = "https://github.com/ShapesDB/sdk-python"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shapesdb"]

[tool.ruff]
line-length = 110
