[project]
name = "sculptary"
version = "0.3.0"
description = "Python SDK for Sculptary: version control and collaboration for 3D"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dependencies = [
    "anyio>=4.6,<5",
    "httpx>=0.27",
    "typing-extensions>=4.6",
]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics :: 3D Modeling"]

[project.urls]
Homepage = "https://sculptary.com"
Source = "https://github.com/Sculptary/sdk-python"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sculptary"]

[tool.ruff]
line-length = 110
